<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全域规划 - 个人专属生活自律与执行中枢</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230f172a%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>LP</text></svg>">
  <!-- 手机端全屏添加到主屏幕支持 (PWA-Ready) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230f172a'/><text x='50' y='65' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>LP</text></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="全域规划">
  <meta name="theme-color" content="#0f172a">
  
  <!-- 本地静态预编译样式 (0 外部网络请求，毫秒级极速直出) -->
  <link rel="stylesheet" href="./css/tailwind.min.css">
  <link rel="stylesheet" href="./css/style.css?v=4.0">
  <!-- GitHub Pages SPA 路由重定向恢复脚本 (支持 /diet, /workout 等二级路径直达且刷新不404) -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
        var cleanDecoded = decoded.startsWith('/') ? decoded : '/' + decoded;
        window.history.replaceState(null, null,
          basePath + cleanDecoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 antialiased selection:bg-emerald-500 selection:text-white">
  <!-- 挂载节点 -->
  <div id="app"></div>

  <!-- 单文件预编译生产产物 (单次 HTTP 请求，彻底消灭瀑布流网络等待) -->
  <script type="module" src="./dist/app.bundle.js?v=8.0"></script>

  <!-- Service Worker 本地持久化缓存：二次访问 0ms 直出 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.0').catch((err) => {
          console.debug('SW reg ignored:', err);
        });
      });
    }
  </script>
</body>
</html>
